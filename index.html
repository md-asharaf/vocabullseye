<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Archer Quiz – Hit the Answer!</title>
  <meta name="description" content="An archery-based vocabulary quiz game. Aim and shoot at the correct answer!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- START SCREEN -->
  <div id="startScreen" class="overlay-screen">
    <div class="start-content">
      <h1 class="game-title">🏹 ARCHER QUIZ</h1>
      <p class="game-subtitle">Shoot the correct answer!</p>
      <div class="start-instructions">
        <div class="instr-item">🖱️ <span>Drag &amp; pull the bow string to aim</span></div>
        <div class="instr-item">✅ <span>Hit correct man = <b>+100 pts</b></span></div>
        <div class="instr-item">❌ <span>Wrong/Miss = <b>-10 pts</b></span></div>
        <div class="instr-item">⚡ <span>Use 50/50 to eliminate 2 wrong options</span></div>
        <div class="instr-item">💡 <span>Use Hint for a memory trick</span></div>
      </div>
      <button id="startBtn" class="btn-primary">START GAME</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="overlay-screen" style="display:none">
    <div class="end-content">
      <h2 class="end-title">🎯 GAME OVER!</h2>
      <div class="end-stats">
        <div class="stat-box">
          <span class="stat-label">Final Score</span>
          <span class="stat-value" id="finalScore">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Max Streak</span>
          <span class="stat-value" id="finalStreak">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Correct</span>
          <span class="stat-value" id="finalCorrect">0</span>
        </div>
      </div>
      <button id="playAgainBtn" class="btn-primary">PLAY AGAIN</button>
    </div>
  </div>

  <!-- GAME WRAPPER -->
  <div id="gameWrapper">
    <!-- TOP HUD -->
    <div id="topHud">
      <div id="questionBox">
        <span id="questionLabel">1/10</span>
        <span id="questionText">Loading question...</span>
      </div>
      <div id="topControls">
        <button id="restartBtn" class="hud-btn" title="Restart">🔄</button>
        <button id="muteBtn" class="hud-btn" title="Mute">🔊</button>
      </div>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- LEFT HUD: score -->
    <div id="scoreDisplay">
      <span class="score-label">SCORE</span>
      <span id="scoreValue">0</span>
    </div>

    <!-- BOTTOM HUD -->
    <div id="bottomHud">
      <button id="fiftyBtn" class="hud-btn bottom-btn" title="50/50">
        <span>50/50</span>
      </button>
      <div id="streakDisplay">
        <span id="streakLabel">Streak: <b id="streakValue">0</b></span>
      </div>
      <button id="hintBtn" class="hud-btn bottom-btn" title="Hint">
        💡 Hint
      </button>
    </div>

    <!-- HINT POPUP -->
    <div id="hintPopup" style="display:none">
      <div id="hintContent"></div>
    </div>

    <!-- FEEDBACK FLASH -->
    <div id="feedbackFlash"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
